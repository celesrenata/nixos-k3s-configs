ollama:
  gpu:
    # -- Enable GPU integration
    enabled: true
    
    # -- GPU type: 'nvidia' or 'amd'
    type: 'nvidia'
    
    # -- Specify the number of GPU to 1
    number: 1
   
  # -- List of models to pull at container startup
  models:
    pull: 
      - llama3.2
      - llama3.1:8b
      - llama3.2-vision:11b
      - qwen3:8b

  persistentVolume:
    enabled: true
    accessModes:
      - ReadWriteOnce
      - ReadOnlyMany
      - ReadWriteMany
    existingClaim: ollama-storage-pvc

runtimeClassName: nvidia

livenessProbe:
  initialDelaySeconds: 4120
image:
  repository: ollama/ollama
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"
