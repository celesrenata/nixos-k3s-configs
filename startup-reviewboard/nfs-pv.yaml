apiVersion: v1
kind: PersistentVolume
metadata:
  name: startup-rb-data
spec:
  persistentVolumeReclaimPolicy: Delete
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
    - ReadWriteMany
  storageClassName: ""
  nfs:
    path: /volume1/Kubernetes/startup/reviewboard/data     # The path to your media
    server: 192.168.42.8     # Your NFS server with Media
  mountOptions:
    - vers=4
    - minorversion=1
    - noac
