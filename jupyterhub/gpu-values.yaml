singleuser:
  image:
    pullPolicy: Always
  profileList:
    - display_name: "CPU Only"
      description: "Standard CPU-only environment"
      kubespawner_override:
        image: quay.io/jupyterhub/k8s-singleuser-sample:3.3.8
        cpu_limit: 4
        cpu_guarantee: 0.1
        mem_limit: "16G"
        mem_guarantee: "512M"
    
    - display_name: "CUDA 12.9 with Python 3.12"
      description: "Ubuntu 24.04, Python 3.12, CUDA 12.9, GPU enabled"
      default: true
      kubespawner_override:
        image: ghcr.io/celesrenata/jupyter-cuda-notebooks:12.9
        cpu_limit: 8
        cpu_guarantee: 0.2
        mem_limit: "64G"
        mem_guarantee: "1G"
        extra_resource_limits:
          nvidia.com/gpu: "1"
        extra_resource_guarantees:
          nvidia.com/gpu: "1"
    
    - display_name: "CUDA 12.9 with Python 3.10"
      description: "Ubuntu 22.04, Python 3.10, CUDA 12.9, GPU enabled"
      kubespawner_override:
        image: ghcr.io/celesrenata/jupyter-cuda-notebooks:12.9-py310
        cpu_limit: 8
        cpu_guarantee: 0.2
        mem_limit: "64G"
        mem_guarantee: "1G"
        extra_resource_limits:
          nvidia.com/gpu: "1"
        extra_resource_guarantees:
          nvidia.com/gpu: "1"
    
    - display_name: "GPU - CUDA 13.0"
      description: "GPU environment with CUDA 13.0 runtime"
      kubespawner_override:
        image: ghcr.io/celesrenata/jupyter-cuda-notebooks:12.9
        cpu_limit: 8
        cpu_guarantee: 0.2
        mem_limit: "64G"
        mem_guarantee: "1G"
        extra_resource_limits:
          nvidia.com/gpu: "1"
        extra_resource_guarantees:
          nvidia.com/gpu: "1"
        environment:
          NVIDIA_VISIBLE_DEVICES: all
          NVIDIA_DRIVER_CAPABILITIES: compute,utility
        cmd: ["bash", "-c"]
        args:
          - |
            apt-get update && apt-get install -y python3 python3-pip curl wget git
            pip3 install jupyterhub notebook jupyterlab ipykernel
            pip3 install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cu130
            pip3 install tensorflow[and-cuda]
            jupyterhub-singleuser



  allowPrivilegeEscalation: true
  
  cloudMetadata:
    blockWithIptables: false
