[program:fix-permissions]
command=/bin/bash -c "chmod g+r /dev/tty0 /dev/tty1 /dev/tty2 2>/dev/null || true; chmod 666 /dev/dri/card0 /dev/dri/renderD128 2>/dev/null || true; chmod 666 /dev/snd/* 2>/dev/null || true; mkdir -p /run/user/1001 && chown celes:celes /run/user/1001"
user=root
autorestart=false
startsecs=0
priority=100
