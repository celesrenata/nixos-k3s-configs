apiVersion: v1
kind: ConfigMap
metadata:
  name: intel-vgpu-configmap
data:
  intel-vgpu-pci-location.sh: |
    #!/usr/bin/env python3
    
    import xml.etree.ElementTree as ET
    import sys
    import tempfile
    import logging
    
    # Set up logging to help with debugging
    logging.basicConfig(level=logging.INFO)
    logger = logging.getLogger(__name__)
    
    def main(s):
        try:
            # Create temporary input file
            tmp_in = tempfile.NamedTemporaryFile(mode='w', suffix='.xml')
            tmp_in.write(s)
            tmp_in.flush()
    
            # Parse XML from file
            xml = ET.parse(tmp_in.name)
            root = xml.getroot()
    
            for addr in root.findall('.//address[@type="pci"]'):
            if addr.attrib.get('bus', None) == '0x08':
                addr.set('bus', '0x00')
                addr.set('slot', '0x02')

        # Create output XML string
            modified_xml = ET.tostring(root, encoding='unicode')
            print(modified_xml)
    
        except ET.ParseError as e:
            logger.error(f"Parsing XML error: {e}")
        finally:
            # Clean up temporary file
            tmp_in.close()
    
    if __name__ == "__main__":
        if len(sys.argv) < 5:
            logger.error("Usage error: missing input arguments")
            sys.exit(1)
    
        main(sys.argv[4])
