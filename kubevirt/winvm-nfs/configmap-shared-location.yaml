apiVersion: v1
binaryData:
  intelgopdriver_desktop.bin: 
data:
  intel-vgpu.sh: "#!/usr/bin/env python3\nimport sys\nimport xml.etree.ElementTree
    as ET\n\n# QEMU XML namespace\nQEMU_NS = \"http://libvirt.org/schemas/domain/qemu/1.0\"\nET.register_namespace('qemu',
    QEMU_NS)\n\ndef main():\n    # --- version negotiation ---\n    if \"--version\"
    in sys.argv:\n        print(\"v1alpha2\")\n        sys.exit(0)\n\n    # --- read
    incoming XML: stdin first, then argv[4] fallback ---\n    xml_data = sys.stdin.read()\n
    \   if not xml_data.strip() and len(sys.argv) > 4:\n        xml_data = sys.argv[4]\n
    \   if not xml_data.strip():\n        sys.exit(0)\n\n    try:\n        root =
    ET.fromstring(xml_data)\n    except ET.ParseError:\n        sys.exit(0)\n\n    #
    --- 1) Remap Q35 PCI root-port controller at 00:02 → slot 04 ---\n    for addr
    in root.findall('.//controller/address[@type=\"pci\"]'):\n        if (addr.get('domain')
    == '0x0000' and\n            addr.get('bus')    == '0x00'   and\n            addr.get('slot')
    \  == '0x02'):\n            addr.set('slot', '0x04')\n\n    # --- 2) CPU tweaks:
    disable hypervisor & hide kvm ---\n    cpu = root.find('cpu')\n    if cpu is None:\n
    \       cpu = ET.SubElement(root, 'cpu',\n                            {'mode':'host-passthrough',\n
    \                            'check':'none'})\n    ET.SubElement(cpu, 'feature',\n
    \                 {'policy':'disable',\n                   'name':'hypervisor'})\n\n
    \   features = root.find('features')\n    if features is None:\n        features
    = ET.SubElement(root, 'features')\n    kvm = ET.SubElement(features, 'kvm')\n
    \   ET.SubElement(kvm, 'hidden', {'state':'on'})\n\n    # --- 3) Push any non-GPU
    device at 00:02.0 → function .1 ---\n    devices = root.find('devices')\n    if
    devices is not None:\n        for dev in devices:\n            if dev.tag == 'controller':\n
    \               continue\n            addr = dev.find(\"address[@type='pci']\")\n
    \           if (addr is not None and\n                addr.get('domain')   ==
    '0x0000' and\n                addr.get('bus')      == '0x00'   and\n                addr.get('slot')
    \    == '0x02'   and\n                addr.get('function') == '0x0'):\n                addr.set('function',
    '0x1')\n\n    # --- 4) Restore your vGPU hostdev back to 00:02.0 and add ROM ---\n
    \   for hostdev in root.findall(\"devices/hostdev[@type='pci']\"):\n        tgt
    = hostdev.find(\"address[@type='pci']\")\n        if tgt is not None:\n            tgt.set('bus',
    \     '0x00')\n            tgt.set('slot',     '0x02')\n            tgt.set('function',
    '0x2')\n        \n        # Add ROM file to hostdev using shared location\n        rom
    = hostdev.find('rom')\n        if rom is None:\n            rom = ET.SubElement(hostdev,
    'rom')\n        rom.set('file', '/var/lib/kubevirt/kvm/intelgopdriver_desktop.bin')\n\n
    \   # --- emit mutated XML ---\n    out = ET.tostring(root, encoding='unicode')\n
    \   sys.stdout.write('<?xml version=\"1.0\"?>\\n' + out)\n\nif __name__ == \"__main__\":\n
    \   main()\n"
