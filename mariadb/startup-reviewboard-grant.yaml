apiVersion: k8s.mariadb.com/v1alpha1
kind: Grant
metadata:
  name: startup-reviewboard-grant 
spec:
  mariaDbRef: 
    name: mariadb
  privileges: 
    - "ALL"
  database: "startup-reviewboard"
  table: "*"
  username: reviewboard
  grantOption: true
  host: "%"
  requeueInterval: 30s
  retryInterval: 5s
