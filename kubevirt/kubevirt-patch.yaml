apiVersion: kubevirt.io/v1
kind: KubeVirt
metadata:
  name: kubevirt
  namespace: kubevirt
spec:
  configuration:
    developerConfiguration:
      cpuAllocationRatio: 10
      featureGates:
        - GPU
        - HostDevices
    permittedHostDevices:
      pciHostDevices:
      - pciVendorSelector: "8086:7d55"
        resourceName: "gpu.intel.com/xe"
        externalResourceProvider: false
