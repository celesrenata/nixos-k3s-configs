---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  labels:
    kubevirt.io/vm: ubiquiti-manager
  name: ubiquiti-manager
spec:
  dataVolumeTemplates:
  - metadata:
      creationTimestamp: null
      name: ubiquiti-manager-volume
    spec:
      pvc:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
        storageClassName: longhorn
      source:
        http:
          url: https://quay.io/containerdisks/ubuntu:24.04
  running: true
  template:
    metadata:
      labels:
        kubevirt.io/vm: ubiquiti-manager
    spec:
      domain:
        devices:
          disks:
          - disk:
              bus: virtio
            name: datavolumedisk1
        resources:
          requests:
            memory: 2Gi
      terminationGracePeriodSeconds: 180
      volumes:
      - dataVolume:
          name: ubiquiti-manager-volume
        name: datavolumedisk1
      - cloudInitNoCloud:
          userData: |-
            #cloud-config
            # The default username is: ubuntu
            ssh_authorized_keys:
              - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEqvp+XbCqCMFZiflp+2gkRjORFp2RkN5o+LvRb2kjL9 celes@esnixi
            password: changeme
            chpasswd: { expire: False }
            ssh_pwauth: True
            runcmd:
              - [ apt-get, install, gnupg, curl, wget ]
              - [ curl, -fsSL, "https://www.mongodb.org/static/pgp/server-7.0.asc", |, gpg, -o, https://www.mongodb.org/static/pgp/server-7.0.asc, --dearmor ]
              - [ echo, "deb [ arch=amd64,arm64 signed-by=/usr/share/keyrings/mongodb-server-7.0.gpg ] https://repo.mongodb.org/apt/ubuntu jammy/mongodb-org/7.0 multiverse", |, tee, /etc/apt/sources.list.d/mongodb-org-7.0.list ]
              - [ apt, update ]
              - [ wget, "https://dl.ui.com/unifi/8.3.32/unifi_sysvinit_all.deb" ]
              - [ apt, install, ./unifi_sysvinit_all.deb ]
        name: cloudinit
status: {}
