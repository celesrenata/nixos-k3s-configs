apiVersion: v1
kind: ConfigMap
metadata:
  name: intel-vgpu-configmap
data:
  intel-vgpu-pci-location.sh: |
    #!/usr/bin/env python3

    import xml.etree.ElementTree as ET
    import sys
    import tempfile
    import logging

    # Set up logging to help with debugging (output at ERROR level)
    logging.basicConfig(level=logging.ERROR)
    logger = logging.getLogger(__name__)

    def main(s):
        try:
            # Validate input type and format before processing
            if not isinstance(s, str) or len(s) < 1:
                raise ValueError("Invalid argument: must provide a string value")

            # Create temporary input file
            tmp_in = tempfile.NamedTemporaryFile(mode='w', suffix='.xml')
            tmp_in.write(s)
            tmp_in.flush()

            # Parse XML from file (with an additional except for SyntaxError)
            try:
                xml = ET.parse(tmp_in.name)
            except ET.ParseError as e:
                logger.error(f"Parsing XML error: {e}")
                raise
            root = xml.getroot()

            # Find the specific <address> tag and modify its bus and slot attributes
            for addr in root.findall('.//address[@type="pci" and @bus="0x08"]'):
                addr.set('bus', '0x00')
                addr.set('slot', '0x02')

            modified_xml = ET.tostring(root, encoding='unicode')
            print(modified_xml)

        except ValueError as e:
            logger.error(f"Invalid input error: {e}")
        finally:
            # Clean up temporary file
            tmp_in.close()

    if __name__ == "__main__":
        try:
            main(sys.argv[4])
        except Exception as e:
            logger.error(f"Error processing argument: {str(e)}")
