apiVersion: v1
kind: PersistentVolume
metadata:
  name: ha-data
spec:
  persistentVolumeReclaimPolicy: Retain
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: "nfs"
  nfs:
    path: /volume1/Kubernetes/homeassistant/data     # The path to your media
    server: 192.168.42.8     # Your NFS server with Media
  mountOptions:
    - vers=4
    - minorversion=1
    - noac
