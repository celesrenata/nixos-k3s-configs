apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: celestium-nextcloud-http
  labels:
    app: nextcloud
spec:
  rules:
    - host: nextcloud.celestium.life
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: celestium-nextcloud
                port:
                  number: 8080
