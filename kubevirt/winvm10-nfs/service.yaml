apiVersion: v1
kind: Service
metadata:
  name: windows10-nfs
spec:
  ports:
    - nodePort: 31310
      name: ssh
      port: 2306
      protocol: TCP
      targetPort: 22
  selector:
    kubevirt.io/vm: windows10-nfs
  sessionAffinity: None
  type: LoadBalancer
status:
  loadBalancer: {}
---
apiVersion: v1
kind: Service
metadata:
  name: windows-nfs-node-exporter
  labels:
    prometheus.kubevirt.io: "node-exporter"
spec:
  ports:
  - name: metrics
    port: 9100
    targetPort: 9100
    protocol: TCP
  selector:
    prometheus.kubevirt.io: "node-exporter"
