---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: disk-windows-pv
  labels:
    type: local
spec:
  storageClassName: "" 
  capacity:
    storage: 128Gi
  accessModes:
    - ReadWriteOnce
    - ReadWriteMany
  hostPath:
    path: "/opt/hostImages/win11"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: disk-windows
spec:
  accessModes:
    - ReadWriteOnce
    - ReadWriteMany
  resources:
    requests:
      storage: 128Gi
  storageClassName: ""
  volumeName: disk-windows-pv
