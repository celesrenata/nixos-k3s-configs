apiVersion: v1
kind: PersistentVolume
metadata:
  name: jupyterhub-shared
spec:
  persistentVolumeReclaimPolicy: Delete
  capacity:
    storage: 1Ti
  accessModes:
    - ReadWriteOnce
    - ReadWriteMany
  storageClassName: ""
  nfs:
    path: /volume1/Kubernetes/jupyter/data     # The path to your media
    server: 192.168.42.8     # Your NFS server with Media
  mountOptions:
    - vers=4
    - minorversion=1
    - noac
