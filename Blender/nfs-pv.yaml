apiVersion: v1
kind: PersistentVolume
metadata:
  name: blender-home
spec:
  persistentVolumeReclaimPolicy: Delete
  capacity:
    storage: 128Gi
  accessModes:
    - ReadWriteOnce
    - ReadOnlyMany
    - ReadWriteMany
  storageClassName: ""
  nfs:
    path: /volume1/Kubernetes/blender/home     # The path to your config 
    server: 192.168.42.8     # Your NFS server with Media
  mountOptions:
    - vers=4
    - minorversion=1
    - noac
