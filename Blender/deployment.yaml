apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.34.0 (HEAD)
  labels:
    io.kompose.service: blender
  name: blender
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: blender
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.34.0 (HEAD)
      labels:
        io.kompose.service: blender
    spec:
      containers:
        - env:
          image: ghcr.io/celesrenata/blender:latest
          name: blender
          ports:
            - containerPort: 3350
              protocol: TCP
            - containerPort: 22
              protocol: TCP
            - containerPort: 3389 
              protocol: TCP
          resources:
            requests:
              cpu: 0.1
              memory: 2Gi
            limits:
               cpu: 12
               memory: 64Gi
               nvidia.com/gpu: "1"
               intel.com/sriov-gpudevice: "1"
          volumeMounts:
            - mountPath: /workspace
              name: blender-workspace
            - mountPath: /home/workspace
              name: blender-home
      restartPolicy: Always
      volumes:
        - name: blender-workspace
          persistentVolumeClaim:
            claimName: blender-workspace
        - name: blender-home
          persistentVolumeClaim:
            claimName: blender-home
