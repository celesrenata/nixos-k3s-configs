apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  creationTimestamp: null
  labels:
    kubevirt.io/vm: arch-nfs
  name: arch-nfs
spec:
  running: true 
  template:
    metadata:
      labels:
        kubevirt.io/vm: arch-nfs
        prometheus.kubevirt.io: "node-exporter" 
    spec:
      domain:
        cpu:
          sockets: 1
          cores: 8 
          threads: 2
        devices:
          # Uncomment the following line when you're ready to disable KVM based Graphics for SR-IOV
          #autoattachGraphicsDevice: false
          gpus:
          - deviceName: intel.com/sriov-gpudevice
            name: gpu1
          disks:
          - disk:
              bus: virtio
            name: arch-nfs-data-volume-pv
          - cdrom:
              bus: sata
            name: archiso
        machine:
          type: q35
        features:
          acpi:
            enabled: true
          apic:
            enabled: true
          smm: {}
        firmware:
          bootloader:
            efi:
              secureBoot: false
          uuid: 5d307ca9-b3ef-428c-8861-06e72d69f223
        resources:
          requests:
            cpu: 0.1
            memory: 16G
      terminationGracePeriodSeconds: 180
      volumes:
      - name: arch-nfs-data-volume-pv 
        persistentVolumeClaim:
          claimName: disk-arch-nfs-pvc
      - name: archiso
        persistentVolumeClaim:
          claimName: arch-iso-pvc
status: {}
