[Globals]
ListenAddress=127.0.0.1
ListenPort=3350
EnableUserWindowManager=true
UserWindowManager=/etc/xrdp/startwm.sh
DefaultWindowManager=/etc/xrdp/startwm.sh
AuthFilePath=disabled

[Security]
AllowRootLogin=true
MaxLoginRetry=4
TerminalServerUsers=tsusers
TerminalServerAdmins=tsadmins
RestrictOutboundClipboard=none
RestrictInboundClipboard=none

[Sessions]
X11DisplayOffset=10
MaxSessions=50
KillDisconnected=false
IdleTimeLimit=0
DisconnectedTimeLimit=0

[Logging]
LogFile=xrdp-sesman.log
LogLevel=INFO
EnableSyslog=true
SyslogLevel=INFO

[Xorg]
param=Xorg
param=-modulepath
param=/usr/lib/xorg/modules
param=-config
param=xrdp/xorg.conf
param=-noreset
param=-nolisten
param=tcp
param=-logfile
param=.xorgxrdp.%s.log

[ChansrvLogging]
LogFile=xrdp-chansrv.log
LogLevel=INFO
EnableSyslog=true
SyslogLevel=INFO

[Chansrv]
FuseMountName=xrdp_client
FileUmask=022
UseNautilus=true
EnableFuseMount=false
DisableAudio=false
ChansrvSocketPerms=0666
AudioSocketPerms=0666

[Environment]
XDG_RUNTIME_DIR=/run/user/%i
DBUS_SYSTEM_BUS_ADDRESS=unix:path=/run/user/%i/pw-dbus-session
