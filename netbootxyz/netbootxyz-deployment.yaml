apiVersion: apps/v1
kind: Deployment
metadata:
  name: netbootxyz
  labels:
    io.kompose.service: netbootxyz
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: netbootxyz
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.service: netbootxyz
    spec:
      hostNetwork: true  # Use host networking to access physical VLAN
      # Pin to gremlin-2
      nodeSelector:
        kubernetes.io/hostname: gremlin-2
      containers:
        - name: netbootxyz
          image: linuxserver/netbootxyz:0.7.6
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
            capabilities:
              add: ["NET_ADMIN", "NET_RAW"]
          ports:
            - containerPort: 3000  # Web UI
            - containerPort: 8080  # HTTP boot
            - containerPort: 69    # TFTP
              protocol: UDP
          env:
            - name: PUID
              value: "1026"
            - name: PGID
              value: "101"
            - name: NGINX_PORT
              value: "8080"
            - name: TZ
              value: "Etc/UTC"
          volumeMounts:
            - mountPath: /config
              name: netbootxyz-config
            - mountPath: /assets
              name: netbootxyz-assets
          # Create VLAN interface on host
          lifecycle:
            postStart:
              exec:
                command: ["sh", "-c", "
                  sleep 5 &&
                  ip link add link bond0 name bond0.100 type vlan id 100 2>/dev/null || true &&
                  ip addr add 192.168.42.16/24 dev bond0.100 2>/dev/null || true &&
                  ip link set bond0.100 up &&
                  echo 'VLAN 100 interface configured on host with IP 192.168.42.16'
                "]
      restartPolicy: Always
      volumes:
        - name: netbootxyz-config
          persistentVolumeClaim:
            claimName: netbootxyz-config
        - name: netbootxyz-assets
          nfs:
            server: 192.168.42.8
            path: /volume1/pxe/assets
